"$schema" = 'https://starship.rs/config-schema.json'

format = """
[░▒▓](#a3d2b2)\
$os\
[](bg:#76f0a0 fg:#a3d2b2)\
$directory\
[](fg:#76f0a0 bg:#2a4a35)\
$git_branch\
$git_status\
[](fg:#2a4a35 bg:#1d3024)\
$nodejs\
$rust\
$golang\
$php\
[](fg:#1d3024 bg:#1a2b1f)\
$time\
[ ](fg:#1a2b1f)\
\n$character"""

[os]
disabled = false
style = "bg:#a3d2b2 fg:#090c0c"
format = '[ $symbol ]($style)'

[os.symbols]
Arch = ""
Macos = ""
Fedora = ""
Linux = ""

[directory]
style = "fg:#090c0c bg:#76f0a0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bg:#2a4a35"
format = '[[ $symbol $branch ](fg:#76f0a0 bg:#2a4a35)]($style)'

[git_status]
style = "bg:#2a4a35"
format = '[[($all_status$ahead_behind )](fg:#76f0a0 bg:#2a4a35)]($style)'

[nodejs]
symbol = ""
style = "bg:#1d3024"
format = '[[ $symbol ($version) ](fg:#76f0a0 bg:#1d3024)]($style)'

[rust]
symbol = ""
style = "bg:#1d3024"
format = '[[ $symbol ($version) ](fg:#76f0a0 bg:#1d3024)]($style)'

[golang]
symbol = ""
style = "bg:#1d3024"
format = '[[ $symbol ($version) ](fg:#76f0a0 bg:#1d3024)]($style)'

[php]
symbol = ""
style = "bg:#1d3024"
format = '[[ $symbol ($version) ](fg:#76f0a0 bg:#1d3024)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:#1a2b1f"
format = '[[  $time ](fg:#a0cba9 bg:#1a2b1f)]($style)'

[python]
symbol = "🐍 "
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
style = "yellow bold"
pyenv_version_name = false
pyenv_prefix = ""
python_binary = ["python3", "python"]
detect_extensions = ["py"]
detect_files = [".python-version", "Pipfile", "__pycache__", "pyproject.toml", "requirements.txt", "setup.py", "tox.ini"]
detect_folders = []
