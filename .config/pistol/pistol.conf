# pistol.conf
#
# 1行 = 1ルール。先頭が MIME タイプの正規表現、残りがコマンド。
# %pistol-filename% がファイルパスに置換される。
# 上から順に評価し、最初にマッチした時点で確定するので順序が重要。
#
# 行頭を `sh:` にすると残り全体が `sh -c` に渡る。
# (pistol 自体は空白で単純分割するだけでクォートを解釈しないため、
#  クォートやパイプを使いたい場合は sh: が必要)
#
# デバッグ: PISTOL_DEBUG=1 pistol <file>
# MIME 確認: file --mime-type <file>

# --- 画像 -> chafa -------------------------------------------------
# kitty のグラフィックスプロトコルで実画像を表示する。
# passthrough=auto で tmux/screen 経由でも通るようにしておく。
# ブロック文字での近似に戻したい場合は --format=symbols に変更する。
#
# lf / ranger は幅・高さ・x・y を追加引数として渡してくる。
# それを %pistol-extra0% / %pistol-extra1% で受けるが、pistol を単体で
# 叩いた場合は空文字になり `--size=x` となって chafa がエラーになる。
# そのためシェル変数に一度受けてからデフォルト値でフォールバックする。
image/.* sh: w=%pistol-extra0%; h=%pistol-extra1%; chafa --format=kitty --passthrough=auto --size="${w:-80}x${h:-25}" %pistol-filename%

# --- 動画 -> ffmpeg + chafa ----------------------------------------
# 代表フレームを1枚 PNG で抜き、chafa に渡して kitty 表示する。
# 画像ルールと見た目が揃う。
#
# enzo はここでは使えない。理由は下の「動画プレーヤー」を参照。
#
# -ss 1 で 1 秒地点をシークするが、1 秒未満の動画では 0 バイトになり
# chafa が失敗するため、空だった場合は先頭フレームにフォールバックする。
# PNG はバイナリなのでコマンド置換ではなく一時ファイルを経由する。
video/.* sh: w=%pistol-extra0%; h=%pistol-extra1%; t=$(mktemp); ffmpeg -v error -y -ss 1 -i %pistol-filename% -frames:v 1 -f image2 -vcodec png "$t" 2>/dev/null; [ -s "$t" ] || ffmpeg -v error -y -i %pistol-filename% -frames:v 1 -f image2 -vcodec png "$t" 2>/dev/null; chafa --format=kitty --passthrough=auto --size="${w:-80}x${h:-25}" "$t"; rm -f "$t"

# --- 動画プレーヤー (enzo) ------------------------------------------
# enzo は対話的な TUI プレーヤーで、raw terminal mode を要求する。
# pistol は子プロセスに cmd.Stdout / cmd.Stderr しか渡さず stdin は
# /dev/null になるため、pistol 経由では
#   failed to enable raw terminal mode: Device not configured
# で必ず落ちる。プレビューアとしては使えない。
#
# enzo はファイルマネージャの「開く」側に割り当てること。
#   lf の lfrc 例:
#     cmd open ${{ case $(file --mime-type -b "$f") in
#         video/*) enzo "$f" ;;
#         *) $EDITOR "$f" ;;
#     esac }}

# text/* とアーカイブはルールを書かない限り pistol の内蔵プレビューアが
# 担当する (chroma によるシンタックスハイライト付き)。
# スタイルは PISTOL_CHROMA_STYLE / PISTOL_CHROMA_FORMATTER で変更可。
